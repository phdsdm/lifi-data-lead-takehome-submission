[project]
name = "lifi-takehome"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=2.0.0",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "pandas>=3.1.0",
    "pytest>=9.2.0",
    "requests>=2.34.2",
]

[project.scripts]
lifi-build-db = "lifi.build_db:main"
lifi-query = "lifi.query:main"

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "analysis"
module-name = "lifi"

[tool.pytest.ini_options]
testpaths = ["analysis/tests"]
